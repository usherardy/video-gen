<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECRU — Launch Film</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
@font-face{font-family:Mont;font-weight:100 900;src:url({{MONTSERRAT}}) format("woff2")}
:root{--ink:#1A1614;--paper:#FFFFFF;--muted:#807C78;--wine:#6B2028}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;overflow:hidden;background:var(--paper);flex:none;transform-origin:center center;color:var(--ink);font-family:Mont,system-ui,sans-serif}
#stage *{box-sizing:border-box}
.layer{position:absolute;inset:0;pointer-events:none}
.el{position:absolute;left:0;top:0;will-change:transform,opacity}
.logo{font-weight:600;letter-spacing:-0.055em;line-height:.82;white-space:nowrap;color:var(--ink)}
.head{font-weight:600;letter-spacing:-0.04em;line-height:.98;color:var(--ink)}
.kick{font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--ink)}
.line{overflow:hidden;padding-bottom:.08em}
.line>span{display:block}
#phones{perspective:2000px}
.phone{position:absolute;left:0;top:0;overflow:hidden;background:#fff;border:1px solid rgba(26,22,20,.10);box-shadow:0 40px 90px rgba(26,22,20,.16),0 8px 22px rgba(26,22,20,.08)}
.phone img,.photo img{width:100%;height:100%;display:block;object-fit:cover}
.photo{position:absolute;left:0;top:0;overflow:hidden;border-radius:18px;box-shadow:0 30px 70px rgba(26,22,20,.16)}
.callout svg{display:block;fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.pill{border:1px solid rgba(26,22,20,.2);border-radius:999px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;white-space:nowrap;color:var(--ink);background:#fff}
#grain{opacity:.025}
#black{background:#000;opacity:0}
#play{position:fixed;inset:0;margin:auto;width:220px;height:68px;border-radius:34px;border:1px solid rgba(26,22,20,.25);
  background:rgba(255,255,255,.9);color:#1A1614;font:500 15px/1 Mont,system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;cursor:pointer;z-index:10}
#play:hover{background:#1A1614;color:#fff}
.render #play{display:none}
</style>
</head>
<body>
<div id="vp"><div id="stage"></div></div>
<button id="play" type="button">▶ Play</button>
<script>
/* DECRU launch film: white, minimal, one message. One paused GSAP master timeline; canvas layers are a pure function of t.
   Live: ▶ Play starts the timeline + music.mp3 together. Render: ?render=1, then window.seek(t) per frame. */
const TL = /*TIMELINE_JSON*/null;
const IMG = { discover: '{{DISCOVER}}', feed: '{{FEED}}', mall: '{{MALL}}',
  nicobar: '{{H_NICOBAR}}', shara: '{{H_SHARA}}', hazan: '{{H_HAZAN}}', kahanii: '{{H_KAHANII}}' };
const ASPECT = { nicobar: 561 / 640, shara: 640 / 640, hazan: 670 / 540, kahanii: 730 / 640 };
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.documentElement.classList.add('render');
const stage = document.getElementById('stage');
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, x) => a + (b - a) * x, pr = (t, a, d) => cl((t - a) / d);
const E = { o3: x => 1 - Math.pow(1 - x, 3), i3: x => x * x * x, io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, o2: x => 1 - (1 - x) * (1 - x) };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- layouts (design px). All text stays inside the 80% safe zone. ---------- */
const LAYOUT = {
  land: { W: 1920, H: 1080, safe: [192, 108, 1728, 972], cx: 960, cy: 540, dot: 24,
    type: { y: 572, size: 34 }, point: { y: 476 }, pain: { size: 150, lines: ['Too many ads.', 'Too little taste.'] },
    feed: { cols: 6, w: 236, gap: 30 }, orb: 300, meet: { kickY: 366, kick: 34, y: 572, w: 1300 },
    phones: { h: 730, pos: [[1030, 560], [1335, 540], [1640, 560]], rot: [12, 0, -12], patch: [1335, 560, 760, 520] },
    call: { x: 232, y: 540, size: 76, width: 640, align: 'left', kick: 20, icon: 64 },
    msg: { size: 122, a: ['Fashion intelligence,', 'built around you.'], b: ['Ranked by your taste.', 'Never by ad spend.'] },
    lock: { x: 210, y: 452, w: 1360, align: 'left',
      photos: [['nicobar', 1500, 560, 380], ['shara', 1735, 318, 220], ['hazan', 1235, 742, 200], ['kahanii', 1795, 742, 190]],
      patch: [1430, 560, 820, 560], tag: { x: 212, y: 742, size: 52 }, pill: { x: 212, y: 846, size: 15 }, url: { size: 22 } } },
  port: { W: 1080, H: 1920, safe: [108, 192, 972, 1728], cx: 540, cy: 960, dot: 24,
    type: { y: 1012, size: 30 }, point: { y: 908 }, pain: { size: 132, lines: ['Too many<br>ads.', 'Too little<br>taste.'] },
    feed: { cols: 3, w: 300, gap: 28 }, orb: 300, meet: { kickY: 818, kick: 34, y: 972, w: 800 },
    phones: { h: 840, pos: [[300, 860], [540, 830], [780, 860]], rot: [14, 0, -14], patch: [540, 860, 900, 900] },
    call: { x: 540, y: 1520, size: 80, width: 860, align: 'center', kick: 22, icon: 66 },
    msg: { size: 90, a: ['Fashion', 'intelligence,', 'built around you.'], b: ['Ranked by', 'your taste.', 'Never by ad spend.'] },
    lock: { x: 540, y: 640, w: 840, align: 'center',
      photos: [['nicobar', 640, 900, 430], ['shara', 290, 1080, 250], ['hazan', 820, 1220, 220], ['kahanii', 360, 1330, 210]],
      patch: [540, 1050, 900, 760], tag: { x: 540, y: 1500, size: 56 }, pill: { x: 540, y: 1612, size: 16 }, url: { size: 24 } } },
};
let L, tl, els = {}, P = {}, ctx, gctx, grainTiles = [], duckP = { v: 1 }, built = false;
function div(cls, html = '', parent = stage) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; }
function at(el, x, y, xp = -50, yp = -50) { gsap.set(el, { left: x, top: y, xPercent: xp, yPercent: yp }); }
const lines = (arr, lastCls = '') => arr.map((s, i) => `<div class="line"><span class="${i === arr.length - 1 ? lastCls : ''}">${s}</span></div>`).join('');
function sizeLogo(el, w) { el.style.fontSize = '100px'; const s = 100 * w / el.getBoundingClientRect().width; el.style.fontSize = s.toFixed(1) + 'px'; }

/* ---------- build ---------- */
async function build(layoutName, startAt = 0) {
  L = LAYOUT[layoutName]; const { W, H, cx, cy } = L;
  if (tl) tl.kill(); stage.innerHTML = ''; els = {};
  stage.style.width = W + 'px'; stage.style.height = H + 'px'; stage.style.transform = 'none';

  const fx = document.createElement('canvas'); fx.width = W; fx.height = H; fx.className = 'layer'; stage.appendChild(fx); ctx = fx.getContext('2d');
  els.point = div('el'); Object.assign(els.point.style, { width: '22px', height: '22px', borderRadius: '50%', background: '#1A1614' }); at(els.point, cx, L.point.y);
  els.orb = div('el'); Object.assign(els.orb.style, { width: L.orb + 'px', height: L.orb + 'px', borderRadius: '50%', background: '#1A1614' }); at(els.orb, cx, cy);
  els.rings = [0, 1].map(() => { const r = div('el'); Object.assign(r.style, { width: L.orb + 'px', height: L.orb + 'px', borderRadius: '50%', border: '1.5px solid rgba(26,22,20,.35)' }); at(r, cx, cy); return r; });
  els.phones = div('layer', '', stage); els.phones.id = 'phones';
  els.photos = div('layer', '', stage);
  els.text = div('layer', '', stage);
  const gc = document.createElement('canvas'); gc.width = W; gc.height = H; gc.className = 'layer'; gc.id = 'grain'; stage.appendChild(gc); gctx = gc.getContext('2d');
  els.black = div('layer', '', stage); els.black.id = 'black';

  const T = (cls, html, x, y, style = {}, xp = -50, yp = -50) => { const d = div('el ' + cls, html, els.text); d.dataset.safe = 1; Object.assign(d.style, style); at(d, x, y, xp, yp); return d; };
  els.type = T('kick', [...TL.typeOn.text].map(c => `<span style="opacity:0">${c === ' ' ? '&nbsp;' : c}</span>`).join(''), cx, L.type.y, { fontSize: L.type.size + 'px', whiteSpace: 'nowrap' });
  els.pain = L.pain.lines.map(s => T('head', s, cx, cy, { fontSize: L.pain.size + 'px', textAlign: 'center', whiteSpace: 'nowrap', opacity: 0 }));
  els.meetK = T('kick', 'Meet', cx, L.meet.kickY, { fontSize: L.meet.kick + 'px', opacity: 0 });
  els.meetLogo = T('logo', 'DECRU', cx, L.meet.y, { opacity: 0 }); sizeLogo(els.meetLogo, L.meet.w);
  const ICON = { pin: 'M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z M12 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z', lens: 'M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z M15.3 15.3 20.5 20.5', bag: 'M5 8h14l-1.3 12.5H6.3L5 8z M9 8V6.6a3 3 0 0 1 6 0V8' };
  const CALL = [['01 — Find', 'pin', 'Brands from<br>every city'], ['02 — Find', 'lens', 'Seen it?<br>Search it.'], ['03 — Keep', 'bag', 'Your private<br>mall']];
  const C = L.call, left = C.align === 'left';
  els.calls = CALL.map(([k, ic, h]) => T('callout', `<div class="kick" style="font-size:${C.kick}px;margin-bottom:${C.kick * 1.1}px;color:#6B2028">${k}</div><svg viewBox="0 0 24 24" style="width:${C.icon}px;height:${C.icon}px;margin:${left ? '0 0 20px -4px' : '0 auto 20px'}"><path d="${ICON[ic]}"/></svg><div class="head" style="font-size:${C.size}px">${h}</div>`,
    C.x, C.y, { width: C.width + 'px', textAlign: C.align, opacity: 0 }, left ? 0 : -50));
  els.msgA = T('head', lines(L.msg.a), cx, cy, { fontSize: L.msg.size + 'px', textAlign: 'center', whiteSpace: 'nowrap' });
  els.msgB = T('head', lines(L.msg.b, 'wine'), cx, cy, { fontSize: L.msg.size + 'px', textAlign: 'center', whiteSpace: 'nowrap' });
  els.msgB.querySelectorAll('.wine').forEach(s => s.style.color = '#6B2028');
  const K = L.lock, lx = K.align === 'left' ? 0 : -50;
  els.lockLogo = T('logo', 'DECRU', K.x, K.y, {}, lx); sizeLogo(els.lockLogo, K.w);
  els.tag = T('head', 'Fashion, found. Not fed.', K.tag.x, K.tag.y, { fontSize: K.tag.size + 'px', fontWeight: 500, letterSpacing: '-0.025em', whiteSpace: 'nowrap', opacity: 0 }, lx);
  els.cta = T('', `<div class="pill" style="display:inline-block;font-size:${K.pill.size}px;padding:${K.pill.size * 1.45}px ${K.pill.size * 2.6}px">Download the app</div><span class="kick" style="font-size:${K.url.size}px;letter-spacing:.24em;text-transform:none;margin-left:${K.url.size * 1.6}px;vertical-align:middle">decru.co</span>`,
    K.pill.x, K.pill.y, { whiteSpace: 'nowrap', opacity: 0 }, lx);
  els.pill = els.cta.querySelector('.pill');

  // phones: the real app screens (photo areas frosted, UI crisp)
  const Ph = L.phones, ph = Ph.h, pw = Math.round(ph * 720 / 1565);
  els.phoneEls = ['discover', 'feed', 'mall'].map((n, k) => {
    const c = div('phone', `<img src="${IMG[n]}">`, els.phones);
    Object.assign(c.style, { width: pw + 'px', height: ph + 'px', borderRadius: Math.round(pw * .12) + 'px' });
    gsap.set(c, { left: Ph.pos[k][0], top: Ph.pos[k][1], xPercent: -50, yPercent: -50, rotationY: Ph.rot[k], opacity: 0 });
    return c;
  });
  // hero collage: real independent-brand photos from decru.co, cropped face-free, tucked behind the wordmark
  els.photoEls = K.photos.map(([n, x, y, w]) => { const c = div('photo', `<img src="${IMG[n]}">`, els.photos);
    Object.assign(c.style, { width: w + 'px', height: Math.round(w * ASPECT[n]) + 'px' }); at(c, x, y); gsap.set(c, { opacity: 0 }); return c; });

  // seeded data: halftone lattice, feed cards, grain
  const R = mulberry32(7), g = L.dot, cols = Math.floor(W / g), rows = Math.floor(H / g), ox = (W - (cols - 1) * g) / 2, oy = (H - (rows - 1) * g) / 2;
  P.dots = []; for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) P.dots.push({ x: ox + i * g, y: oy + j * g, d: R(), r: .3 + R() });
  const F = L.feed, fx0 = (W - (F.cols * F.w + (F.cols - 1) * F.gap)) / 2; P.feed = [];
  for (let c = 0; c < F.cols; c++) { let y = -R() * 300; for (let k = 0; k < 9; k++) { const h = F.w * (1.15 + R() * .55); P.feed.push({ x: fx0 + c * (F.w + F.gap), y, w: F.w, h, ad: R() < .5, spd: .85 + (c % 2) * .3, d: R(), tone: R() }); y += h + F.gap; } }
  P.feedLoop = Math.max(...P.feed.map(f => f.y + f.h)) + F.gap;
  for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), im = x.createImageData(256, 256), r = mulberry32(500 + k); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); grainTiles[k] = c; }

  fit(); buildTimeline(); built = true; seekTo(startAt);
}

/* ---------- master timeline ---------- */
function buildTimeline() {
  const { W, H } = L, S = TL.shots;
  tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  tl.set({}, {}, TL.duration);

  // 0–3 · an ink point pulses twice; the halftone grid blooms out of it; type-on
  gsap.set(els.point, { scale: 0 }); gsap.set([els.orb, ...els.rings], { scale: 0, opacity: 0 });
  tl.to(els.point, { scale: 1, duration: .35, ease: 'expo.out' }, .15)
    .to(els.point, { scale: 1.9, duration: .2, ease: 'power2.out' }, .45).to(els.point, { scale: 1, duration: .32, ease: 'power2.in' }, .65)
    .to(els.point, { scale: 2.2, duration: .2, ease: 'power2.out' }, 1.05).to(els.point, { scale: 1, duration: .32, ease: 'power2.in' }, 1.25)
    .to(els.point, { scale: 0, duration: .45, ease: 'power3.in' }, 1.6);
  [...els.type.children].forEach((c, k) => tl.set(c, { opacity: 1 }, TL.typeOn.start + k * TL.typeOn.step));
  tl.to(els.type, { opacity: 0, y: -12, duration: .25, ease: 'power2.in' }, 2.72);

  // 3–7 · the feed; hard text cuts on the beat
  const [p1, p2] = els.pain;
  tl.set(p1, { opacity: 1 }, S.push).fromTo(p1, { scale: 1.1, filter: 'blur(10px)' }, { scale: 1, filter: 'blur(0px)', duration: .4, ease: 'expo.out', immediateRender: false }, S.push)
    .set(p1, { opacity: 0 }, 5.0).set(p2, { opacity: 1 }, 5.0)
    .fromTo(p2, { scale: 1.1, filter: 'blur(10px)' }, { scale: 1, filter: 'blur(0px)', duration: .4, ease: 'expo.out', immediateRender: false }, 5.0)
    .to(p2, { scale: .1, opacity: 0, filter: 'blur(12px)', duration: .75, ease: 'power3.in' }, 6.95);

  // 7–12 · the noise collapses into one ink dot, which grows, compresses and floods the frame
  tl.to(els.orb, { scale: .12, opacity: 1, duration: .5, ease: 'expo.out' }, 8.6).to(els.orb, { scale: 1, duration: 2.6, ease: 'power1.inOut' }, 9.1);
  els.rings.forEach((r, k) => tl.fromTo(r, { scale: .9, opacity: .8 }, { scale: 2.6, opacity: 0, duration: 1.4, ease: 'power2.out', immediateRender: false }, 9.6 + k * .8));
  const cover = Math.hypot(W, H) * 1.1 / L.orb;
  tl.to(els.orb, { scale: .14, duration: .6, ease: 'power4.in' }, 11.2).to(els.orb, { scale: cover, duration: .17, ease: 'power3.in' }, 11.82)
    .set(els.orb, { opacity: 0 }, S.meet);

  // 12 · hard cut to white: MEET DECRU (the real wordmark: Montserrat SemiBold, -0.055em)
  tl.set([els.meetK, els.meetLogo], { opacity: 1 }, S.meet)
    .fromTo(els.meetLogo, { scale: 1.08, filter: 'blur(14px)' }, { scale: 1, filter: 'blur(0px)', duration: .55, ease: 'expo.out', immediateRender: false }, S.meet)
    .fromTo(els.meetK, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'expo.out', immediateRender: false }, S.meet + .08)
    .to([els.meetK, els.meetLogo], { y: -50, opacity: 0, filter: 'blur(8px)', duration: .3, ease: 'power2.in', stagger: .03 }, 12.85);
  shake(S.meet, .45, 10);

  // 12–20 · the real app, three features
  const Ph = L.phones;
  els.phoneEls.forEach((c, k) => {
    tl.fromTo(c, { y: 380, opacity: 0, filter: 'blur(10px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .85, ease: 'expo.out', immediateRender: false }, 12.95 + [1, 0, 2][k] * .1)
      .to(c, { y: -14, rotationY: Ph.rot[k] + (k === 1 ? 2 : 4), duration: 3.15, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 13.75);
  });
  const FOCUS = [1, 0, 2];
  els.calls.forEach((c, i) => {
    const T0 = TL.callouts[i], T1 = i < 2 ? TL.callouts[i + 1] - .32 : 19.7, path = c.querySelector('path'), len = path.getTotalLength(), left = L.call.align === 'left';
    gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
    tl.fromTo(c, { ...(left ? { x: -50 } : { y: 40 }), opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: .75, ease: 'expo.out', immediateRender: false }, T0)
      .to(path, { strokeDashoffset: 0, duration: .9, ease: 'power2.inOut' }, T0 + .1)
      .to(c, { opacity: 0, ...(left ? { x: 30 } : { y: -24 }), duration: .3, ease: 'power2.in' }, T1);
    els.phoneEls.forEach((p, k) => tl.to(p, k === FOCUS[i] ? { scale: 1.06, opacity: 1, duration: .7, ease: 'expo.out' } : { scale: .96, opacity: .42, duration: .7, ease: 'expo.out' }, T0));
  });
  els.phoneEls.forEach((c, k) => tl.to(c, { y: '+=140', opacity: 0, filter: 'blur(8px)', duration: .45, ease: 'power2.in' }, 19.8 + k * .06));

  // 20–24 · the message: each line rises on its own beat
  const rise = (el, times, out) => { const spans = [...el.querySelectorAll('.line>span')]; gsap.set(spans, { yPercent: 110 }); gsap.set(el, { opacity: 0 }); tl.set(el, { opacity: 1 }, times[0]);
    spans.forEach((s, i) => tl.to(s, { yPercent: 0, duration: .7, ease: 'expo.out' }, times[i])); tl.to(el, { opacity: 0, y: -30, duration: .25, ease: 'power2.in' }, out); };
  const nA = L.msg.a.length, nB = L.msg.b.length;
  rise(els.msgA, L.msg.a.map((_, i) => i === nA - 1 ? 21.35 : 20.3 + i * .14), 22.5);
  rise(els.msgB, L.msg.b.map((_, i) => i === nB - 1 ? 23.1 : 22.7 + i * .14), 23.82);

  // 24–30 · the lockup: the site's hero, rebuilt — the wordmark over independent brands
  gsap.set(els.lockLogo, { clipPath: 'inset(0 100% 0 0)' });
  tl.to(els.lockLogo, { clipPath: 'inset(0 0% 0 0)', duration: .5, ease: 'power3.out' }, 24.0);
  els.photoEls.forEach((c, k) => tl.fromTo(c, { y: 90, opacity: 0, scale: .94 }, { y: 0, opacity: 1, scale: 1, duration: .8, ease: 'expo.out', immediateRender: false }, 24.08 + k * .09));
  tl.to(els.photoEls, { y: -8, duration: .07, ease: 'power2.out' }, 24.95).to(els.photoEls, { y: 0, duration: .5, ease: 'power3.out' }, 25.02);
  tl.fromTo(els.tag, { y: 24, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: .9, ease: 'power3.out', immediateRender: false }, 26.0)
    .fromTo(els.cta, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .8, ease: 'power3.out', immediateRender: false }, 28.1)
    .to([els.lockLogo, els.photos], { scale: 1.015, duration: 4.4, ease: 'sine.inOut' }, 25.1)
    .to(els.pill, { backgroundColor: '#1A1614', color: '#ffffff', borderColor: '#1A1614', duration: .12, ease: 'none' }, S.finalBeat)
    .set(els.black, { opacity: 1 }, S.black);

  // audio cues + ducking (live only)
  TL.cues.forEach(c => tl.call(sfx, [c.f, c.gain], Math.max(0, c.at - ((TL.sfx[c.f] || {}).peak || 0))));
  [...TL.typeOn.text].forEach((ch, k) => { if (ch !== ' ') tl.call(sfx, ['sfx_tick.mp3', TL.typeOn.tickGain], TL.typeOn.start + k * TL.typeOn.step); });
  tl.call(startVO, null, TL.vo.start);
  TL.vo.phrases.forEach(p => { const len = (p.src[1] != null ? p.src[1] - p.src[0] : 1.67) / (p.tempo || 1);
    tl.to(duckP, { v: TL.vo.duck, duration: .15, ease: 'none' }, p.t - .1).to(duckP, { v: 1, duration: .15, ease: 'none' }, p.t + len + .02); });
  tl.eventCallback('onComplete', onEnd);
}
function shake(t0, dur, amp) {
  const r = mulberry32(Math.round(t0 * 100)), n = Math.round(dur / .04), tg = [els.text, els.phones, els.photos];
  for (let k = 0; k < n; k++) { const a = amp * (1 - k / n); tl.to(tg, { x: (r() - .5) * 2 * a, y: (r() - .5) * 2 * a, duration: .04, ease: 'none' }, t0 + k * .04); }
  tl.to(tg, { x: 0, y: 0, duration: .05, ease: 'none' }, t0 + n * .04);
}

/* ---------- per-frame canvas: halftone dots, the feed, the collapse, grain (pure function of t) ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function frame(t) {
  const { W, H, cx, cy } = L; ctx.clearRect(0, 0, W, H);
  const dot = (x, y, a, r = 1.3) => { if (a < .01) return; ctx.fillStyle = `rgba(26,22,20,${a.toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); };
  const ellipse = (x, y, [ex, ey, ew, eh]) => { const d = Math.hypot((x - ex) / (ew / 2), (y - ey) / (eh / 2)); return cl(1 - (d - .45) / .55); };
  // halftone: blooms out of the point, softens under the feed, spirals into the dot
  if (t < 10.2) {
    const reach = Math.hypot(W, H) * .62, R0 = E.o2(pr(t, 1.45, 1.4)) * reach, px = L.cx, py = L.point.y;
    const base = t < 3 ? .2 : lerp(.2, .09, pr(t, 3, .6));
    for (const p of P.dots) {
      const d = Math.hypot(p.x - px, p.y - py); if (d > R0) continue;
      const front = Math.exp(-Math.pow((R0 - d) / 50, 2)) * (1 - pr(t, 3, .4)), fade = Math.max(0, 1 - d / reach) * .6 + .4;
      let x = p.x, y = p.y; const k = E.i3(pr(t, 7 + p.d * 1.4, 2.3));
      if (k > 0) { const r0 = Math.hypot(x - cx, y - cy), ang = Math.atan2(y - cy, x - cx) + k * 2.6 * p.r, r = r0 * (1 - k); x = cx + Math.cos(ang) * r; y = cy + Math.sin(ang) * r; }
      dot(x, y, (base * fade + .55 * front) * (1 - pr(t, 9.6, .5)), 1.3 + front * 1.4);
    }
  }
  // the feed: grey cards, half of them "Sponsored", scrolling faster and faster, then collapsing into the dot
  if (t >= 3 && t < 10) {
    const s = t - 3, scroll = 40 * s + 70 * s * s + 260 * E.o3(pr(t, 3.85, .35)), inA = pr(t, 3, .2);
    ctx.font = `600 ${Math.round(L.feed.w * .055)}px Mont`; ctx.textBaseline = 'middle';
    for (const f of P.feed) {
      let y = ((f.y - scroll * f.spd) % P.feedLoop + P.feedLoop) % P.feedLoop - 260, x = f.x, sc = 1;
      const k = E.i3(pr(t, 7 + f.d * .9, 1.6));
      if (k > 0) { const fx = x + f.w / 2, fy = y + f.h / 2; x = lerp(fx, cx, k) - f.w / 2; y = lerp(fy, cy, k) - f.h / 2; sc = 1 - k; }
      if (sc <= .01 || y > H + 20 || y + f.h < -20) continue;
      ctx.save(); ctx.translate(x + f.w / 2, y + f.h / 2); ctx.scale(sc, sc); ctx.globalAlpha = inA * (1 - k * .3);
      const w = f.w, h = f.h; rr(-w / 2, -h / 2, w, h, 16); ctx.fillStyle = '#F2F0ED'; ctx.fill();
      rr(-w / 2 + 10, -h / 2 + 10, w - 20, h * .66, 10); ctx.fillStyle = f.tone > .5 ? '#E6E3DF' : '#EBE8E4'; ctx.fill();
      ctx.fillStyle = '#DEDAD5'; rr(-w / 2 + 12, -h / 2 + h * .66 + 22, w * .62, 9, 4); ctx.fill(); rr(-w / 2 + 12, -h / 2 + h * .66 + 40, w * .38, 9, 4); ctx.fill();
      if (f.ad) { const tw = ctx.measureText('Sponsored').width + 22; rr(-w / 2 + 20, -h / 2 + 20, tw, 26, 13); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill(); ctx.fillStyle = 'rgba(26,22,20,.62)'; ctx.fillText('Sponsored', -w / 2 + 31, -h / 2 + 33.5); }
      ctx.restore();
    }
    const a = (1 - pr(t, 6.95, .6)) * inA;   // a soft white field keeps the centre message clean
    if (a > 0) { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .42); g.addColorStop(0, `rgba(255,255,255,${.96 * a})`); g.addColorStop(.55, `rgba(255,255,255,${.85 * a})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  }
  // halftone patches: behind the phones, and behind the lockup with a shimmer sweep at 24.0
  const patch = (rect, a0, sweep) => { for (const p of P.dots) { const m = ellipse(p.x, p.y, rect); if (m <= 0) continue; let a = a0 * m, r = 1.3;
    if (sweep != null) { const sw = Math.exp(-Math.pow((p.x - sweep) / 70, 2)); a += sw * .35 * m; r += sw * 1.2; } dot(p.x, p.y, a, r); } };
  if (t >= 12.6 && t < 20.4) patch(L.phones.patch, .2 * pr(t, 12.9, .6) * (1 - pr(t, 19.8, .5)));
  if (t >= 23.95) patch(L.lock.patch, .22 * pr(t, 23.95, .3) * (1 - pr(t, 29.9, .05)), t < 24.7 ? lerp(-200, W + 200, E.io3(pr(t, 24.0, .65))) : null);
  // grain (seeded tiles, 24 fps)
  const gi = Math.floor(t * 24), r = mulberry32(gi + 11), tile = grainTiles[gi % 4], ox = -(r() * 256 | 0), oy = -(r() * 256 | 0);
  gctx.clearRect(0, 0, W, H); for (let x = ox; x < W; x += 256) for (let y = oy; y < H; y += 256) gctx.drawImage(tile, x, y);
}

/* ---------- audio (live mode); missing files fail silently ---------- */
const AUD = {}; let live = false;
function mkAudio(f) { const a = new Audio(); a.preload = 'auto'; a.addEventListener('error', () => { a._bad = true; }); a.src = f; return a; }
function initAudio() { if (AUD.music) return; AUD.music = mkAudio(TL.music.file); AUD.vo = mkAudio(TL.vo.file); Object.keys(TL.sfx).forEach(f => AUD[f] = mkAudio(f)); }
function sfx(f, gain) { if (RENDER || !live) return; const b = AUD[f]; if (!b || b._bad) return; try { const a = b.cloneNode(); a.volume = cl(gain); a.play().catch(() => {}); } catch (e) {} }
function startVO() { if (RENDER || !live) return; const v = AUD.vo; if (!v || v._bad) return; try { v.currentTime = 0; v.volume = TL.vo.gain; v.play().catch(() => {}); } catch (e) {} }
function play() { initAudio(); live = true; document.getElementById('play').style.display = 'none';
  const m = AUD.music; if (m && !m._bad) { try { m.currentTime = 0; m.volume = 1; m.play().catch(() => {}); } catch (e) {} } tl.play(0); }
function onEnd() { if (RENDER) return; live = false; const b = document.getElementById('play'); b.textContent = '↺ Replay'; b.style.display = ''; try { AUD.vo && AUD.vo.pause(); } catch (e) {} }
gsap.ticker.add(() => {
  if (!built || RENDER) return;
  if (live) { const m = AUD.music;
    if (m && !m._bad && !m.paused && m.readyState > 2 && m.currentTime < TL.duration - .6) { const d = m.currentTime - tl.time(); if (Math.abs(d) > .04) tl.time(m.currentTime, true); }
    if (m && !m._bad) m.volume = cl(duckP.v * TL.music.gain); }
  frame(tl.time());
});

/* ---------- layout, scaling, seeking ---------- */
const mq = matchMedia('(orientation: portrait)');
function layoutName() { return RENDER ? (innerHeight > innerWidth ? 'port' : 'land') : (mq.matches ? 'port' : 'land'); }
function fit() { if (!L) return; const s = Math.min(innerWidth / L.W, innerHeight / L.H); stage.style.transform = `scale(${s})`; }
function seekTo(t) { tl.seek(t, true); frame(t); }
addEventListener('resize', fit);
mq.addEventListener('change', () => { const t = tl ? tl.time() : 0, was = tl && tl.isActive(); build(layoutName(), t).then(() => { if (was) tl.play(); }); });
document.getElementById('play').addEventListener('click', play);
window.SAFE = () => L.safe;
window.ready = Promise.all([document.fonts.load('600 100px Mont'), document.fonts.load('500 40px Mont')]).then(() => build(layoutName(), 0)).then(() => true);
window.seek = t => seekTo(t);
</script>
</body>
